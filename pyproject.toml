[tool.poetry]
name = "macos-ai-agent"
version = "0.1.0"
description = "Personal AI agent for macOS file management"
authors = ["Developer"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
google-genai = "^1.59.0"
jsonschema = "^4.26.0"
python-dotenv = "^1.2.1"
cryptography = "^46.0.5"
unified-planning = "^1.2.0"
spacy = "^3.8.11"
beautifulsoup4 = "^4.13.0"
websockets = "^15.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
pytest-asyncio = "^1.3.0"
ruff = "^0.14.13"
mypy = "^1.19.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
exclude = "(^tests/|^ui/|^agent_host/tools/)"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=agent_host --cov-report=term-missing"
